[package]
name = "launch-shield-runtime-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
bincode = "=1.3.3"
launch-shield-program = { path = "../program" }
solana-program = "=2.2.1"
solana-program-test = "=2.2.1"
solana-sdk = "=2.2.1"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }