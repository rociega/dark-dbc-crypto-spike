[package]
name = "launch-shield-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
bincode = "=1.3.3"
solana-program = "=2.2.1"
sp1-solana = "=0.1.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
launch-shield-proof-relation = { path = "../proof/relation" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }