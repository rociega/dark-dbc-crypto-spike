[package]
name = "launch-shield-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
ark-bn254 = "=0.4.0"
ark-ff = "=0.4.2"
ark-serialize = "=0.4.2"
bincode = "=1.3.3"
groth16-solana = "=0.2.0"
solana-program = "=2.2.1"
sha2 = "=0.10.9"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
launch-shield-proof-relation = { path = "../proof/relation" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }