[package]
name = "dark-dbc-crypto-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dev-dependencies]
curve25519-dalek = "=4.1.3"
sha2 = "=0.10.9"
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"
solana-zk-sdk = "=7.0.1"
solana-zk-sdk-pod = "=0.1.2"
# Token-2022 9.x uses the Solana 2.x SDK types at its instruction boundary.
solana-zk-sdk-token = { package = "solana-zk-sdk", version = "=2.3.13" }
spl-token-2022 = "=9.0.0"
spl-token-confidential-transfer-proof-generation = "=0.6.1"
# Keep SDK 7's transitive Solana support crates on Rust 1.88-compatible patches.
solana-address = "=2.5.0"
solana-hash = "=4.2.0"
solana-instruction-error = "=2.2.0"
solana-pubkey = "=4.1.0"
solana-signature = "=3.3.0"
solana-signer = "=3.0.0"
solana-transaction-error = "=3.1.0"

# The native Solana test runtime is large; omit debug info in constrained
# environments so cryptography dependencies can compile within memory limits.
[profile.dev]
debug = 0

[profile.test]
debug = 0
