[package]
name = "private-claims-onchain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
ark-bn254 = "=0.4.0"
ark-ff = "=0.4.2"
ark-serialize = "=0.4.2"
bincode = "=1.3.3"
bytemuck = "=1.22.0"
groth16-solana = "=0.2.0"
private-claims-proof-relation = { path = "../proof/relation" }
solana-program = "=2.2.1"
sha2 = "=0.10.9"
spl-token-confidential-transfer-proof-extraction = "=0.3.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }

[dev-dependencies]